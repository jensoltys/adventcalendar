<html><head><meta charset="utf-8">
<!-- Share picture template: ?theme=workshop&door=7 (door=all for the full stocking). Rendered by share-art/render.cjs -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@600;700&display=swap">
<style>
:root{--bg:#10221C;--bg2:#1d3a31;--ink:#FBF3E9;--soft:#C9D6CE;--a:#C97B5F;--b:#7A9579;--c:#B8845A;--gold:#E8B04B;--inside:#0B1814;--card:#FBF3E9;--cink:#2E2A26}
[data-t=plum]{--bg:#2A1F2E;--bg2:#3A2B3F;--ink:#FAF8F5;--soft:#DCCFDD;--a:#57425B;--b:#E07A5F;--c:#7E9A7E;--gold:#E8A87C;--inside:#1D1520;--card:#FAF8F5;--cink:#2C2C2C}
[data-t=jen8n]{--bg:#1E1030;--bg2:#2E1A48;--ink:#F9F5FC;--soft:#D9C2F2;--a:#5B2A86;--b:#D2581A;--c:#8A56B8;--gold:#F6B93B;--inside:#140A22;--card:#F9F5FC;--cink:#221A2C}
[data-t=meadow]{--bg:#0E2A1D;--bg2:#164030;--ink:#F3FAF5;--soft:#BFE3CC;--a:#1B8052;--b:#C93A56;--c:#D35E27;--gold:#FFC84A;--inside:#081C13;--card:#F3FAF5;--cink:#1D2A22}
[data-t=arcade]{--bg:#08090C;--bg2:#13161A;--ink:#F4FFFD;--soft:#B9C8C6;--a:#C7314A;--b:#1D7F78;--c:#3A3F4A;--gold:#FFD166;--inside:#050608;--card:#F4FFFD;--cink:#08090C}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;color:var(--ink);font-family:Figtree,sans-serif;display:grid;grid-template-columns:640px 1fr;align-items:center;padding:0 70px;gap:40px;
background:radial-gradient(2px 2px at 12% 18%,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 9%,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(2.5px 2.5px at 64% 32%,rgba(255,255,255,.35) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 30% 75%,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(120% 90% at 30% 0%,var(--bg2),var(--bg) 70%);background-size:340px 340px,420px 420px,380px 380px,300px 300px,100% 100%}
.brand{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;color:var(--soft);margin-bottom:14px}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:86px;line-height:.98;letter-spacing:-.02em}
h1 b{color:var(--gold);font-size:1.18em}
p{font-size:29px;color:var(--soft);margin-top:22px;line-height:1.3;font-weight:600}
.url{display:inline-block;margin-top:28px;background:var(--gold);color:#2a1d08;font-weight:800;font-size:25px;padding:10px 20px;border-radius:999px}
.stage{position:relative;height:440px;display:grid;place-items:center}
.door{position:relative;width:300px;height:380px;border-radius:26px;background:var(--inside);box-shadow:inset 0 0 0 5px var(--gold),0 30px 60px -30px rgba(0,0,0,.8);perspective:900px}
.panel{position:absolute;inset:0;border-radius:26px;transform-origin:left center;transform:rotateY(-62deg);background:var(--a);overflow:hidden;filter:brightness(.85)}
.panel::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 14px,transparent 14px 30px)}
.panel i{position:absolute;top:0;bottom:0;left:60%;width:18px;background:var(--gold)}
.num{position:absolute;left:22px;bottom:12px;font-family:'Bricolage Grotesque';font-weight:800;font-size:96px;color:#fff;z-index:2}
.sock{position:absolute;width:170px;left:150px;top:70px;transform:rotate(8deg)}
.glow{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 45%,transparent),transparent 65%)}
</style></head><body>
<div>
  <div class="brand" id="brand"></div>
  <h1 id="head">I opened<br>door <b id="n">7</b></h1>
  <p id="sub">A free surprise behind every door until December 24. Come open yours.</p>
  <span class="url" id="url"></span>
</div>
<div class="stage">
  <div class="glow"></div>
  <div class="door"><div class="panel"><i></i></div><span class="num" id="dn">7</span>
    <svg class="sock" viewBox="0 -14 96 164"><path d="M18 30h56v62c0 8 2 12 8 18 10 10 6 32-14 34-12 1-22-6-32-14-10-8-18-16-18-30z" fill="var(--b)"/><path d="M18 58h56v10H18zM18 80h56v8H18z" fill="var(--card)" opacity=".92"/><path d="M56 120c6 2 16 6 24 2" stroke="var(--c)" stroke-width="8" fill="none" stroke-linecap="round"/><g id="pop"></g><rect x="10" y="8" width="72" height="26" rx="13" fill="var(--card)"/><ellipse cx="34" cy="46" rx="6" ry="7.5" fill="var(--cink)"/><ellipse cx="60" cy="46" rx="6" ry="7.5" fill="var(--cink)"/><circle cx="36.5" cy="42.5" r="2.4" fill="#fff"/><circle cx="62.5" cy="42.5" r="2.4" fill="#fff"/><path d="M39 54q8 10 16 0z" fill="var(--cink)"/></svg>
  </div>
</div>
<script>
var q = new URLSearchParams(location.search), t = q.get('theme') || 'workshop', d = q.get('door') || '7';
var BRAND = q.get('brand') || 'Advent Calendar', URL_TEXT = q.get('url') || '';
document.documentElement.setAttribute('data-t', t);
document.getElementById('brand').textContent = BRAND;
var u = document.getElementById('url'); if (URL_TEXT) u.textContent = URL_TEXT; else u.remove();
if (d === 'all') {
  document.getElementById('head').innerHTML = 'I opened<br>all <b>24</b> doors';
  document.getElementById('sub').textContent = 'My stocking is stuffed. There\'s still time to open yours.';
  document.getElementById('dn').textContent = '24';
  document.getElementById('pop').innerHTML = '<rect x="22" y="-6" width="16" height="16" rx="3" fill="var(--gold)"/><rect x="54" y="-12" width="18" height="18" rx="3" fill="var(--a)"/><circle cx="46" cy="0" r="7" fill="var(--c)"/>';
} else { document.getElementById('n').textContent = d; document.getElementById('dn').textContent = d; }
</script>
</body></html>
