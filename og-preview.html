<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Figtree,sans-serif;color:#FBF3E9;
 background:radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(2px 2px at 64% 32%,rgba(255,255,255,.35) 50%,transparent 51%),radial-gradient(120% 80% at 30% 0%,#1d3a31,#10221C 70%);background-size:340px 340px,420px 420px,380px 380px,100% 100%;
 display:grid;grid-template-columns:520px 1fr;gap:48px;padding:64px 64px 56px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;margin-bottom:28px}
.brand b{color:#E8B04B}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:66px;line-height:1.02;letter-spacing:-.02em}
p{font-size:27px;color:#C9D6CE;margin-top:22px;line-height:1.35}
.url{margin-top:30px;font-weight:700;font-size:22px;color:#E8B04B}
.g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:118px;gap:12px;grid-auto-flow:dense}
.g span{border-radius:14px;position:relative;overflow:hidden;font-family:'Bricolage Grotesque';font-weight:800;color:#fff;font-size:38px;padding:4px 12px;display:flex;align-items:flex-end;background:#C97B5F;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 22px -12px rgba(0,0,0,.7)}
.g span:nth-child(3n+2){background:#7A9579}.g span:nth-child(4n+3){background:#B8845A}.g span:nth-child(5n+4){background:#A85F45}
.g span.r::before,.g span.r::after{content:"";position:absolute;background:#E8B04B}
.g span.r::before{top:0;bottom:0;left:62%;width:9px}.g span.r::after{left:0;right:0;top:34%;height:9px}
.g .big{grid-column:span 2;grid-row:span 2;background:linear-gradient(145deg,#F6D27A,#E8B04B 45%,#B9812A)!important;color:#4a3110;font-size:84px;padding:8px 20px}
.g .big::before,.g .big::after{background:#fff8ec!important}
.g .open{background:#0B1814!important;box-shadow:inset 0 0 0 3px #E8B04B;color:#E8B04B;font-size:22px;align-items:center;justify-content:center}
</style></head><body>
<div>
  <div class="brand"><svg width="44" height="44" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#C97B5F"/><rect x="9" y="13" width="22" height="18" rx="3" fill="#FBF3E9"/><rect x="18.5" y="13" width="3" height="18" fill="#E8B04B"/><rect x="9" y="19.5" width="22" height="3" fill="#E8B04B"/><path d="M20 13c-3-5-8-4-7-1 1 2 5 1 7 1zm0 0c3-5 8-4 7-1-1 2-5 1-7 1z" fill="#E8B04B"/></svg><span id="brand">Advent <b>Calendars</b></span></div>
  <h1>A free advent calendar that gets better every day</h1>
  <p>One door a day, December 1 to 24. The best ones are saved for the end.</p>
  <div class="url" id="url"></div>
</div>
<div class="g">
  <span class="r">7</span><span>15</span><span class="open">Free tool</span><span class="r">22</span>
  <span class="big r">24</span><span>4</span><span class="r">18</span><span>1</span><span class="r">12</span><span>3</span><span class="r">9</span><span>20</span><span class="r">5</span>
</div>
<script>
var q = new URLSearchParams(location.search);
if (q.get('brand')) document.getElementById('brand').textContent = q.get('brand');
var u = document.getElementById('url'); if (q.get('url')) u.textContent = q.get('url'); else u.remove();
</script>
</body></html>
